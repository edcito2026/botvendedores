name: 📊 Actualizar BD diariamente

on:
  schedule:
    # 6 PM Perú (UTC-5) = 11 PM UTC
    - cron: '0 23 * * *'
    # 9 PM Perú (UTC-5) = 2 AM UTC (día siguiente)
    - cron: '0 2 * * *'

  # También permite ejecutar manualmente desde GitHub
  workflow_dispatch:

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 🔧 Instalar dependencias
        run: |
          python -m pip install --upgrade pip

      - name: 🚀 Ejecutar extractor de BD optimizado
        run: |
          python ACTUALIZADOR_DB_OPTIMIZADO.py

      - name: 📝 Configurar Git
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions Bot"

      - name: 📤 Commit y Push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "📊 Auto: BD actualizada - $(date '+%Y-%m-%d %H:%M:%S')"
            git push origin main
            echo "✅ BD actualizada y pusheada a GitHub"
          else
            echo "✅ Sin cambios en BD"
          fi

      - name: 📧 Notificación de éxito
        if: success()
        run: |
          echo "✅ Actualización de BD completada exitosamente"
          echo "Fecha: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 🚨 Notificación de error
        if: failure()
        run: |
          echo "❌ Error en la actualización de BD"
          exit 1
